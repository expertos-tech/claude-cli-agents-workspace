# Support and validation toolbox. Images pinned by tag and digest.
# Run tools with scripts/validate.sh. Sonar lives in docker/sonar/ (scripts/sonar.sh).
# Variables come from custom/env/docker.env (template: .env.example here), passed with --env-file.
# The workspace is mounted read-only: the containers run as root, which would get past the read-only core of an
# installed workspace. Only terraform and infracost write, and only in the module folder scripts/validate.sh mounts
# writable on top (a folder of projects/, tmp/ or custom/).
name: ai-workspace-tools

x-tool: &tool
  volumes:
    - ${WORKSPACE_DIR:-..}:/work:ro
  working_dir: /work

services:
  terraform:
    <<: *tool
    image: hashicorp/terraform:1.17.1@sha256:a5d5a5a892c98f60fcbfa81eac2a40fc19e7b3fa7719bccae10ff6111d22524a
    environment:
      TF_PLUGIN_CACHE_DIR: /plugin-cache
      TF_IN_AUTOMATION: "1"
    volumes:
      - ${WORKSPACE_DIR:-..}:/work:ro
      - terraform-plugins:/plugin-cache

  tflint:
    <<: *tool
    image: ghcr.io/terraform-linters/tflint:v0.65.0@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359

  trivy:
    <<: *tool
    image: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    volumes:
      - ${WORKSPACE_DIR:-..}:/work:ro
      - trivy-cache:/root/.cache/trivy

  gitleaks:
    <<: *tool
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

  shellcheck:
    <<: *tool
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    entrypoint: ["shellcheck"]

  hadolint:
    <<: *tool
    image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    entrypoint: ["hadolint"]

  markdownlint:
    <<: *tool
    image: davidanson/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca

  mermaid:
    <<: *tool
    image: minlag/mermaid-cli:12.0.1@sha256:b4e90c56d42f2ff2960b619456b9b876f6d9d2218593eace7d53f3fcbbdb5b23

  infracost:
    <<: *tool
    image: infracost/infracost:0.10.47@sha256:76ad6948e83bffb4b6127c9cae13faea068981bcb2b081526920d9bb88a399e1
    environment:
      INFRACOST_API_KEY: ${INFRACOST_API_KEY:-}

  ruff:
    <<: *tool
    image: ghcr.io/astral-sh/ruff:0.17.3@sha256:691f37347e1693862ee3d69dbe1d77433fe2d74859339c48c1c52764fda80308

  biome:
    <<: *tool
    build:
      context: ./biome

  python-coverage:
    <<: *tool
    build:
      context: ./python-coverage
    network_mode: none
    environment:
      COVERAGE_TIMEOUT_SECONDS:
    volumes:
      - ${WORKSPACE_DIR:-..}:/work:ro

volumes:
  terraform-plugins:
  trivy-cache:
