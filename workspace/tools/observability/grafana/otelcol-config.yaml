# Copy of /otel-lgtm/otelcol-config.yaml from the image pinned in ../compose.yaml. The only
# change removes personal data and free text from new telemetry. Re-sync when upgrading the image.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  # Personal data and free text. Datapoint, log record and span attributes.
  attributes/drop-personal-data:
    actions: &personal-data
      - {key: user.email, action: delete}
      - {key: user.id, action: delete}
      - {key: user.account_uuid, action: delete}
      - {key: user.account_id, action: delete}
      - {key: organization.id, action: delete}
      - {key: process.owner, action: delete}
      - {key: process_owner, action: delete}
      - {key: tool_input, action: delete}
      - {key: tool_parameters, action: delete}
      - {key: process.command_args, action: delete}
      - {key: full_command, action: delete}
      - {key: file_path, action: delete}
      - {key: bash_argv0, action: delete}
      - {key: error, action: delete}
      - {pattern: '^process\.executable\..+$', action: delete}
  resource/drop-personal-data:
    attributes: *personal-data

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/drop-personal-data, resource/drop-personal-data, batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [attributes/drop-personal-data, resource/drop-personal-data, batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [attributes/drop-personal-data, resource/drop-personal-data, batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
