# Login simulator in place of Auth0, always on. Run once from the workspace root; Docker starts it again at boot:
#   docker compose --env-file custom/env/login-simulator.env -f tools/login-simulator/compose.yaml up -d --build
# The users and applications come from LOGIN_SIMULATOR_CONFIG (a path relative to this folder), set in
# custom/env/login-simulator.env (template: .env.example here), else the example config/config.json. Without that
# file, pass --env-file tools/login-simulator/.env.example. A change to the users file takes effect on restart:
#   docker compose --env-file custom/env/login-simulator.env -f tools/login-simulator/compose.yaml restart
# Details in README.md.
name: login-simulator

services:
  login-simulator:
    build: .
    image: login-simulator:0.1.0   # also the image a project's test stack runs, with its own config file
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    environment:
      # Generated avatars at the fixed address below: the browser (the Linux host routes to container addresses)
      # and every container on this network open the same URL. README "Generated avatar".
      AVATAR_ORIGIN: http://172.31.250.10:8080
    ports:
      - "127.0.0.1:28080:8080"   # browser: http://localhost:28080
    volumes:
      - ${LOGIN_SIMULATOR_CONFIG:-./config/config.json}:/config/config.json:ro
    networks:
      default:
        ipv4_address: 172.31.250.10   # outside ip_range, so no other container takes it first

# Fixed name, so other local stacks can attach to it as external and reach login-simulator:8080.
# Fixed subnet, so the simulator keeps the address of AVATAR_ORIGIN; other containers get one from ip_range.
networks:
  default:
    name: login-simulator
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
