# Azurite and the console, on their own. Host ports only on 127.0.0.1.
# AZURITE_ACCOUNT_KEY and DOCKER_SOCKET_GID come from the environment or custom/env/azurite-console.env, passed with
# --env-file (template: .env.example here); see README.md. In the group of every tool: tools/compose.yaml (/run-tools).
# Without the key, Azurite exits at start and the console never starts. The check runs in the container, not as a
# required variable of Compose: the group loads every tool's file, and a required variable would stop them all.
name: azurite-console

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    # The Blob SDK of go.mod sends an API version newer than this Azurite knows.
    entrypoint: ["/bin/sh", "-c", "if [ -z \"$$AZURITE_ACCOUNT_KEY\" ]; then echo 'error: set AZURITE_ACCOUNT_KEY in custom/env/azurite-console.env' >&2; exit 1; fi; AZURITE_ACCOUNTS=\"devstoreaccount1:$$AZURITE_ACCOUNT_KEY\"; export AZURITE_ACCOUNTS; unset AZURITE_ACCOUNT_KEY; exec \"$$@\"", "azurite"]
    command: ["azurite", "--location", "/data", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    environment:
      AZURITE_ACCOUNT_KEY: "${AZURITE_ACCOUNT_KEY:-}"
    ports:
      - "127.0.0.1:30000:10000"
      - "127.0.0.1:30001:10001"
      - "127.0.0.1:30002:10002"
    volumes:
      - azurite-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001 && nc -z 127.0.0.1 10002"]
      interval: 5s
      timeout: 3s
      retries: 12

  azurite-console:
    x-run-tools:   # read by scripts/run-tools.sh and /run-tools
      title: Azurite console
      description: Page to see and operate the local Azurite (blobs, queues, tables and the access log), with Azurite
      url: http://localhost:28091
      requires: [AZURITE_ACCOUNT_KEY]   # from custom/env/azurite-console.env
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AZURITE_ACCOUNT_KEY: "${AZURITE_ACCOUNT_KEY:-}"
    ports:
      - "127.0.0.1:28091:28091"
    # The docker CLI reads the access log of the azurite container through the socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/azurite-console", "-healthcheck", "-addr", ":28091"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  azurite-data:
